name: Enterprise Python CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    name: Code Hygiene, SAST & Matrix Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Linting, SAST & Testing Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 mypy bandit coverage build

    - name: Stage 1 - Static Analysis & PEP 8 Check (flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Stage 2 - Static Type Checking (mypy)
      run: |
        mypy --ignore-missing-imports calculator_engine.py

    - name: Stage 3 - SAST Vulnerability Scan (bandit)
      run: |
        bandit -r calculator_engine.py -ll

    - name: Stage 4 - Automated Test Execution & Code Coverage
      run: |
        coverage run -m unittest discover -s . -p "test_*.py"
        coverage report --fail-under=90 -m

  distribution-package:
    name: Automated Packaging & Wheel Artifact Creation
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Build Module
      run: pip install build

    - name: Compile Distribution Tarball & Wheel
      run: |
        python -c 'open("setup.py", "w").write("""from setuptools import setup\nsetup(name=\"quant_engine\", version=\"1.0.0\", py_modules=[\"calculator_engine\"])\n""")'
        python -m build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-wheel-packages
        path: dist/
