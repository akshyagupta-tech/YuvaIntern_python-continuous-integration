name: Enterprise Python CI/CD Pipeline

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    name: Code Hygiene, SAST & Matrix Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install Pinned Runtime and Quality Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt -r requirements-dev.txt

    - name: Prepare CI Artifacts
      run: mkdir -p artifacts

    - name: Strict PEP 8 Gate
      run: python -m flake8 . --count --max-line-length=79 --statistics

    - name: Strict Static Type Gate
      run: >-
        python -m mypy --strict --ignore-missing-imports
        quant_engine.py telemetry.py engine.py calculator_engine.py calc.py
        core/week6_ci.py app.py

    - name: SAST Security Gate
      run: python -m bandit -r . -x ./.git,./tests -ll

    - name: Dependency Vulnerability Audit
      run: pip-audit -r requirements.txt --format json --output artifacts/pip-audit.json

    - name: Unit Tests and Branch-Aware Coverage Gate
      run: |
        python -m coverage run --branch --source=quant_engine,telemetry,engine -m unittest discover -s . -p "test_*.py" -v 2>&1 | tee artifacts/test-results.txt
        python -m coverage report --fail-under=90 -m
        python -m coverage html --directory artifacts/coverage
        python -m coverage xml -o artifacts/coverage.xml

    - name: Health Check and Build Metadata
      run: |
        python -m engine --check | tee artifacts/health-check.json
        python -m engine --metadata > artifacts/build-metadata.json
        python -m engine --benchmark > artifacts/benchmark-report.json

    - name: Archive Test and Coverage Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports-python-${{ matrix.python-version }}
        path: artifacts/
        if-no-files-found: warn
        retention-days: 14

  distribution-package:
    name: Automated Packaging & Wheel Artifact Creation
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Build Dependencies
      run: python -m pip install -r requirements.txt -r requirements-dev.txt

    - name: Build Wheel and Source Distribution
      run: python -m build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-wheel-packages
        path: dist/
